<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuremberg Network Diagnosis</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/diagnose.css" />
</head>
<body class="diagnose">
  <aside id="sidebar">
    <nav class="steps"><a href="/"><b>1</b><span>Live</span></a><a href="/diagnose" class="active"><b>2</b><span>Diagnose</span></a><a href="/planner"><b>3</b><span>Plan</span><i id="queued" class="badge hidden"></i></a></nav>

    <section>
      <div id="layer-list" class="layer-list"></div>
    </section>

    <section id="layer-info">
      <p id="info-question" class="question"></p>
      <div id="legend" class="legend-box"></div>
      <div id="sd-mode" class="sd-mode hidden">
        <label><input type="radio" name="sdmode" value="index" checked /> Supply per resident</label>
        <label><input type="radio" name="sdmode" value="redundant" /> Bus places where rail already serves</label>
      </div>
      <div id="summary"></div>
    </section>

    <!-- shown when a problem spot is selected -->
    <section id="spot" class="spot hidden">
      <button id="spot-close" class="link back">← all problem spots</button>
      <h3 id="spot-title"></h3>
      <p id="spot-detail" class="muted small"></p>
      <div id="spot-lines" class="line-chips"></div>
      <h2>What you can do</h2>
      <ul id="spot-suggestions" class="suggestions"></ul>
    </section>

    <section id="spots-section">
      <h2 id="top-title">Problem spots</h2>
      <p class="muted small">Click a spot to see the lines and stops there and what you can do.</p>
      <ol id="top-list" class="top-list"></ol>
      <button id="top-more" class="link hidden">Show more</button>
      <h2 id="lines-title" class="mt">Lines most affected</h2>
      <ol id="line-list" class="line-list"></ol>
    </section>

    <section class="map-controls">
      <h2>Map</h2>
      <select id="line-filter" aria-label="Highlight a line"><option value="">Highlight a line…</option></select>
      <label><input type="checkbox" id="fade-lines" checked /> Fade lines that are not involved</label>
      <div class="two-col">
        <label><input type="checkbox" data-layer="net-UBahn" checked /> U-Bahn</label>
        <label><input type="checkbox" data-layer="net-Tram" checked /> Tram</label>
        <label><input type="checkbox" data-layer="net-Bus" checked /> City bus</label>
        <label><input type="checkbox" data-layer="net-Regio" /> Regional bus</label>
        <label><input type="checkbox" id="show-stops" checked /> Stops (zoom in)</label>
        <label><input type="checkbox" id="show-live" /> Live vehicles</label>
        <label><input type="checkbox" id="show-problems" checked /> Problem layer</label>
      </div>
    </section>

    <details>
      <summary>How this is measured</summary>
      <p class="muted small" id="info-source"></p>
      <label class="small" id="bus-only-row"><input type="checkbox" id="bus-only" checked /> Buses only (observed layers)</label>
    </details>
  </aside>
  <main id="map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="/static/netmap.js"></script>
  <script src="/static/diagnose.js"></script>
</body>
</html>
